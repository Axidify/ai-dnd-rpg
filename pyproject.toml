[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
extend-exclude = ["tests/live", "docs/SCENARIO_TEMPLATE.py"]

[tool.ruff.lint]
# CI gate: syntax errors and undefined names only (these crash at runtime).
# Widen this as the codebase is cleaned up.
select = ["E9", "F63", "F7", "F82"]
