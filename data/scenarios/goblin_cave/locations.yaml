  map_x: 0.5
  map_y: 0.72
  map_icon: 👁️
  map_region: cave
- id: goblin_camp_main
  name: Goblin Warren - Main Camp
  description: A large cavern lit by smoky torches. Four goblins lounge around a central fire. Cages line
    the far wall - one holds a young girl! A sturdy door to the side is marked 'STORAGE'.
  exits:
    back: goblin_camp_entrance
    cages: goblin_camp_cages
    chief: chief_tunnel
    storage: goblin_storage
  direction_aliases:
    w: back
    west: back
    e: cages
    east: cages
    n: chief
    north: chief
    s: storage
    south: storage
  exit_conditions:
  - exit_name: storage
    condition: has_item:storage_key
    fail_message: The storage door is locked. You need a key.
  npcs:
  - goblins
  items:
  - shortsword
  - rations
  - healing_potion
  - gold_pouch_small
  atmosphere:
    sounds:
    - guttural goblin chatter
    - crackling campfire
    - dice rattling
    - distant sobbing
    - chains clinking
    smells:
    - unwashed bodies
    - burnt meat
    - smoke
    - fear sweat
    textures:
    - greasy pelts on the ground
    - crude bone dice
    - smoky air stinging eyes
    lighting: flickering torchlight, deep shadows in corners
    temperature: uncomfortably warm from the fire
    mood: chaotic and dangerous
    danger_level: deadly
    random_details:
    - a goblin picking its teeth with a bone
    - stolen village goods piled haphazardly
    - crude drawings of violence on the walls
    - a half-eaten rat on a plate
  enter_text: You enter the main goblin camp. Four goblins look up from their fire.
  encounter:
  - goblin
  - goblin
  - goblin
  - goblin
  map_x: 0.5
  map_y: 0.82
  map_icon: ⚔️
  map_region: cave
- id: goblin_camp_shadows
  name: Goblin Warren - Shadows
  description: A dark alcove along the cavern wall. From here you can observe the camp without being seen.
    Something glints in the corner.
  exits:
    camp: goblin_camp_main
    cages: goblin_camp_cages
    chief: chief_tunnel
  direction_aliases:
    s: camp
    south: camp
    e: cages
    east: cages
    n: chief
    north: chief
  items:
  - poison_vial
  - dagger
  - storage_key
  atmosphere_text: Hidden, good vantage point for surprise attack
  enter_text: You slip into the shadows. From here you can see the whole camp.
  events:
  - id: shadow_discovery
    trigger: on_first_visit
    narration: You find a dead goblin scout here - poisoned. Someone else is hunting these creatures.
      A brass key hangs from his belt.
  map_x: 0.35
  map_y: 0.78
  map_icon: 👤
  map_region: cave
- id: goblin_storage
  name: Goblin Warren - Storage Room
  description: A cramped storage room full of stolen goods. Barrels of food, crates of weapons, and a
    locked chest in the corner.
  exits:
    camp: goblin_camp_main
  direction_aliases:
    n: camp
    north: camp
  items:
  - healing_potion
  - healing_potion
  - gold_pouch
  - shortsword
  - leather_armor
  - silver_locket
  - family_ring
  atmosphere_text: Musty, piles of stolen village goods, potential treasure
  enter_text: The storage door creaks open. You've found the goblins' loot stash!
  events:
  - id: storage_discovery
    trigger: on_first_visit
    narration: You recognize some of the stolen goods - supplies from the village! There's enough here
      to make looting worthwhile. You spot something glinting - family heirlooms perhaps?
    effect: xp:25
  map_x: 0.35
  map_y: 0.88
  map_icon: 📦
  map_region: cave
- id: goblin_camp_cages
  name: Goblin Warren - Prisoner Cages
  description: Crude iron cages along the wall. A young girl (Lily) cowers in one, her eyes wide with
    fear and hope.
  exits:
    camp: goblin_camp_main
  direction_aliases:
    w: camp
    west: camp
  npcs:
  - lily
  items:
  - lockpicks
  atmosphere_text: Lily's quiet sobs, the clink of chains
  enter_text: You approach the cages. The girl's eyes light up with hope.
  events:
  - id: lily_found
    trigger: on_first_visit
    narration: Lily gasps and reaches through the bars. 'Please, help me! The chief wants to eat me!'
    effect: objective:rescue_lily
  map_x: 0.65
  map_y: 0.82
  map_icon: 🔒
  map_region: cave
- id: chief_tunnel
  name: Passage to Chief's Lair
  description: A passage leading to the back of the cave. It's more decorated - skulls on spikes, crude
