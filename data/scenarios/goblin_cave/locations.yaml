  exits:
    camp: goblin_camp_main
    lair: boss_chamber
  direction_aliases:
    s: camp
    south: camp
    n: lair
    north: lair
  items:
  - antidote
  atmosphere_text: More 'decorated' than the camp, clearly important
  enter_text: You head toward the chief's lair. The decorations grow more gruesome.
  events:
  - id: tunnel_tripwire
    trigger: on_first_visit
    narration: A thin wire is stretched across the passage! It's a trap!
    effect: skill_check:dex:12|damage:1d4
  map_x: 0.5
  map_y: 0.92
  map_icon: ⚰️
  map_region: cave
- id: boss_chamber
  name: Chief Grotnak's Throne Room
  description: A large chamber dominated by a throne of bones. Chief Grotnak sits counting coins, flanked
    by two goblin bodyguards.
  exits:
    escape: chief_tunnel
    hidden alcove: treasure_nook
  direction_aliases:
    s: escape
    south: escape
  npcs:
  - grotnak
  - bodyguards
  items:
  - healing_potion
  - gold_pouch
  - longsword
  hidden_items:
  - item_id: chiefs_medallion
    skill: investigation
    dc: 14
    hint: Something glints beneath the throne of bones...
  atmosphere:
    sounds:
    - Grotnak's low chuckling
    - coins clinking
    - bodyguards shifting their weight
    - dripping from stalactites
    smells:
    - blood
    - wet fur
    - smoke from braziers
    - the chief's rancid breath
    textures:
    - bones underfoot
    - cold stone walls
    - oily torchlight on metal
    lighting: dramatic torchlight, the throne casting long shadows
    temperature: cold with hot braziers
    mood: menacing confrontation
    danger_level: deadly
    random_details:
    - trophies from fallen adventurers on the walls
    - a crude map scratched into the floor
    - the chief's rusted crown askew
    - bodyguards' yellow eyes following every movement
  enter_text: You enter the throne room. Chief Grotnak looks up with a wicked grin.
  events:
  - id: chief_confrontation
    trigger: on_first_visit
