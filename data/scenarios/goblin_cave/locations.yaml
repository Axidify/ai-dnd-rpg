    effect: start_combat:goblin_boss
  encounter:
  - goblin_boss
  - goblin
  map_x: 0.5
  map_y: 0.98
  map_icon: 👑
  map_region: cave
- id: treasure_nook
  name: Chief's Secret Stash
  description: A cramped alcove hidden behind a false panel in the wall. The chief's personal treasure
