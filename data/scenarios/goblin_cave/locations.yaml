# Goblin Cave locations. Fields map 1:1 to scenario.Location.

- id: tavern_main
  name: The Rusty Dragon - Main Room
  description: A cozy common room with a crackling hearth. Wooden tables are scattered about, some occupied
    by locals nursing their drinks. A bar runs along one wall where a gruff barkeep polishes mugs.
  exits:
    bar: tavern_bar
    outside: village_square
  direction_aliases:
    n: bar
    north: bar
    s: outside
    south: outside
  npcs:
  - bram
  - locals
  - barkeep
  items:
  - torch
  atmosphere:
    sounds:
    - crackling hearth
    - murmured conversations
    - clinking tankards
    - occasional laughter
    - creaking floorboards
    smells:
    - wood smoke
    - spilled ale
    - roasting meat
    - pipe tobacco
    textures:
    - worn wooden tables
    - sticky ale rings
    - rough-hewn chairs
    lighting: warm firelight casting dancing shadows
    temperature: comfortably warm from the hearth
    mood: welcoming with undercurrents of worry
    danger_level: safe
    random_details:
    - a cat dozing by the fire
    - a farmer's muddy boots by the door
    - a wanted poster curling on the wall
    - scratches on the floor from moved furniture
  enter_text: You push through the tavern door, warmth washing over you.
  map_x: 0.15
  map_y: 0.08
  map_icon: 🍺
  map_region: village
- id: tavern_bar
  name: The Rusty Dragon - Bar
  description: A worn wooden bar with a gruff but friendly barkeep polishing mugs. Bottles line the shelves
    behind.
  exits:
    main room: tavern_main
  direction_aliases:
    s: main room
    south: main room
  npcs:
  - barkeep
  atmosphere_text: Clinking glasses, the barkeep's watchful eye
  enter_text: You approach the bar. The barkeep nods in greeting.
  map_x: 0.15
  map_y: 0.02
  map_icon: 🍻
  map_region: village
- id: village_square
  name: Village Square
  description: A small village square with a well at the center. Most shops are closed for the evening,
    but warm light and the clang of a hammer spill from the blacksmith's forge to the west.
  exits:
    tavern: tavern_main
    east road: forest_path
    forge: blacksmith_shop
  direction_aliases:
    n: tavern
    north: tavern
    e: east road
    east: east road
    w: forge
    west: forge
    blacksmith: forge
    in: forge
    inside: forge
    enter: forge
  atmosphere_text: Quiet evening, the rhythmic clang of a hammer from the forge, distant sounds of village
    life
  enter_text: You step out into the cool evening air of the village square. The blacksmith's forge glows
    nearby to the west.
  map_x: 0.5
  map_y: 0.08
  map_icon: 🏛️
  map_region: village
- id: blacksmith_shop
  name: Blacksmith's Forge
  description: A warm, smoky forge with an anvil at the center. Weapons and armor hang on the walls, and
    the heat from the furnace fills the small shop.
  exits:
    outside: village_square
    square: village_square
  direction_aliases:
    e: outside
    east: outside
  npcs:
  - gavin
  atmosphere_text: Heat from the forge, the smell of hot metal and coal, rhythmic hammering
  enter_text: You step into the warmth of the forge.
  map_x: 0.85
  map_y: 0.08
  map_icon: 🛠️
  map_region: village
- id: forest_path
  name: Forest Path
  description: A winding dirt path through an ancient forest. Autumn leaves crunch underfoot.
  exits:
    village: village_square
    deeper: forest_clearing
    east: forest_clearing
  direction_aliases:
    w: village
    west: village
    e: deeper
    east: deeper
  atmosphere_text: Dappled sunlight, bird calls, rustling leaves
  enter_text: The village fades behind as you enter the forest.
  random_encounters:
  - id: wolf_ambush
    enemies:
    - wolf
    max_triggers: 2
    cooldown: 3
    narration: A hungry wolf emerges from the underbrush, teeth bared!
  map_x: 0.5
  map_y: 0.28
  map_icon: 🌲
  map_region: forest
- id: forest_clearing
  name: Forest Clearing
  description: A small clearing where the path forks. An old signpost points east toward 'Darkhollow'.
  exits:
    back: forest_path
    east: darkhollow_approach
    cave: darkhollow_approach
    hidden path: secret_cave
  direction_aliases:
    w: back
    west: back
    e: east
    east: east
  items:
  - rations
  atmosphere_text: Birds go quiet here. An uneasy stillness.
  enter_text: You emerge into a clearing. The trees seem to lean away from the eastern path.
  map_x: 0.35
  map_y: 0.38
  map_icon: 🌳
  map_region: forest
- id: secret_cave
  name: Hidden Hollow
  description: A small natural cave hidden behind overgrown vines. It's cool and quiet inside, clearly
    undisturbed for years.
  exits:
    out: forest_clearing
    exit: forest_clearing
  direction_aliases:
    w: out
    west: out
  hidden: true
  discovery_condition: skill:perception:14
  discovery_hint: The vines along the cliff face seem unusually thick in one spot...
  items:
  - ancient_amulet
  - healing_potion
  - gold_coins
  atmosphere_text: Peaceful, ancient, the scent of old magic
  enter_text: You push through the vines and discover a hidden hollow. Treasure glints in the dim light!
  events:
  - id: secret_discovery
    trigger: on_first_visit
    narration: This hollow has been hidden for decades! Old adventurer's gear lies scattered about, including
      some valuable items.
  map_x: 0.2
  map_y: 0.42
  map_icon: 🔮
  map_region: forest
  map_hidden: true
- id: darkhollow_approach
  name: Approach to Darkhollow
  description: The forest grows darker and more twisted. Goblin signs become visible - crude markers,
    bones hanging from branches.
  exits:
    back: forest_clearing
    cave: cave_entrance
  direction_aliases:
    w: back
    west: back
    e: cave
    east: cave
  items:
  - goblin_ear
  atmosphere_text: Ominous, the smell of something foul ahead
  enter_text: The path narrows. Crude goblin warnings hang from the trees.
  events:
  - id: goblin_warning_signs
    trigger: on_first_visit
    narration: Crude goblin totems and skulls on spikes line the path - a clear warning to trespassers.
  map_x: 0.65
  map_y: 0.38
  map_icon: ⚠️
  map_region: forest
- id: cave_entrance
  name: Darkhollow Cave Entrance
  description: A gaping maw in the rocky hillside. Goblin totems flank the entrance, and bones litter
    the ground.
  exits:
    forest: darkhollow_approach
    enter cave: cave_tunnel
    inside: cave_tunnel
  direction_aliases:
    w: forest
    west: forest
    e: enter cave
    east: enter cave
    d: enter cave
    down: enter cave
  items:
  - torch
  atmosphere:
    sounds:
    - wind moaning through the cave mouth
    - distant dripping
    - faint echoes
    - the occasional bone crunching underfoot
    smells:
    - decay
    - goblin musk
    - damp earth
    - rotting meat
    textures:
    - rough stone
    - slippery moss near entrance
    - scattered bones
    - crude goblin carvings
    lighting: daylight fading into oppressive darkness
    temperature: cold air flowing from within
    mood: foreboding
    danger_level: threatening
    random_details:
    - a human skull on a spike
    - claw marks on the entrance stones
    - old torch stubs ground into the dirt
    - a tattered cloak caught on a rock
  enter_text: Before you looms the entrance to Darkhollow Cave.
  events:
  - id: cave_ambience
    trigger: on_first_visit
    narration: A cold wind rushes out from the cave mouth, carrying the stench of goblins and something
      worse.
  map_x: 0.65
  map_y: 0.5
  map_icon: 💀
  map_region: forest
- id: cave_tunnel
  name: Dark Tunnel
  description: A narrow passage descending into darkness. The walls are slick with moisture. Distant goblin
    chatter echoes ahead.
  exits:
    outside: cave_entrance
    deeper: goblin_camp_entrance
    forward: goblin_camp_entrance
  direction_aliases:
    w: outside
    west: outside
    u: outside
    up: outside
    e: deeper
    east: deeper
    d: deeper
    down: deeper
  atmosphere_text: Pitch black without light, dripping water, echoing sounds
  enter_text: You descend into the darkness. The light fades behind you.
  random_encounters:
  - id: giant_spider
    enemies:
    - giant_spider
    chance: 25
    min_visits: 1
    narration: A massive spider drops from the ceiling, blocking your path!
  map_x: 0.5
  map_y: 0.62
  map_icon: 🕯️
  map_region: cave
- id: goblin_camp_entrance
  name: Goblin Warren - Entrance
